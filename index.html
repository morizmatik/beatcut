<body>
<div class="page">
<aside id="rail" aria-label="Clips">
<label><span id="videoName"></span> <span id="videoAdd" class="add"></span><input id="video" type="file" accept="video/*,.avi" multiple></label>
<details id="fetch">
<summary><span data-i18n="fetch.title"></span></summary>
<form id="fetchForm" autocomplete="off">
<textarea id="fetchText" rows="2" data-i18n-ph="fetch.ph" spellcheck="false"></textarea>
<div class="frow">
<select id="fetchMode">
<option value="links" data-i18n="fetch.mode.links"></option>
<option value="search" data-i18n="fetch.mode.search"></option>
</select>
<button id="fetchGo" type="submit" data-i18n="fetch.go"></button>
</div>
<div id="fetchProg" hidden>
<div class="fbar"><i></i></div>
<div class="fline"><span id="fetchStep"></span><button id="fetchCancel" type="button" class="quiet" data-i18n="fetch.cancel"></button></div>
<div id="fetchSpeed" class="fspeed"></div>
<div id="fetchThumbs" class="fthumbs" hidden></div>
</div>
<p id="fetchMsg" class="fmsg" hidden></p>
<div id="fetchHelper" class="frow" hidden>
<button id="fetchLaunch" type="button" data-i18n="fetch.launch"></button>
<a id="fetchGet" href="beatcut-clipper.zip" download data-i18n="fetch.get"></a>
</div>
<details class="fopts">
<summary data-i18n="fetch.params"></summary>
<label class="fnum"><span data-i18n="fetch.per"></span><input id="fetchPer" type="number" inputmode="numeric" min="1" max="10" step="1"></label>
<label class="fnum"><span data-i18n="fetch.len"></span><input id="fetchLen" type="number" inputmode="numeric" min="1" max="30" step="1"></label>
<label class="fnum"><span data-i18n="fetch.height"></span><input id="fetchHeight" type="number" inputmode="numeric" min="240" max="2160" step="120"></label>
</details>
</form>
<button id="fetchClips" type="button" class="quiet" data-i18n="fetch.latest"></button>
</details>
<ol id="clips" hidden></ol>
<div id="clipsEmpty" class="empty" data-i18n="empty.clips"></div>
<div id="tip" class="tip" aria-hidden="true"></div>
</aside>
<main>
<div class="metabar" aria-hidden="true"><span>Screwify</span><span>Beat</span><span>Cut</span><span>Slow</span></div>
<header class="top">
<h1 data-i18n="title">Beatcut</h1>
<div class="topActions">
<label class="musicTop"><span class="mlabel" data-i18n="audio"></span><span id="audioName"></span><input id="audio" type="file" accept="audio/*,video/*"></label>
<details id="presetMenu" class="menu">
<summary data-i18n="presets"></summary>
<div class="menubody" id="presetBody"></div>
</details>
</div>
</header>
<div id="status" role="status"></div>
<div class="wavebox"><canvas id="wave" width="1800" height="180"></canvas>
<div id="waveEmpty" class="empty"><span data-i18n="empty.wave"></span><button id="waveAdd" type="button" data-i18n="empty.addAudio"></button></div><div id="head"></div><div class="yscale" aria-hidden="true"><span>+1</span><span>0</span><span>–1</span></div>
<dl id="info" hidden>
<div><dt data-i18n="info.dur"></dt><dd id="iDur"></dd></div>
<div><dt data-i18n="info.bpm"></dt><dd><input id="iBpm" class="num" type="number" min="30" max="300" step="0.1"></dd></div>
<div><dt data-i18n="info.offset"></dt><dd><input id="iOffset" class="num" type="number" min="0" max="60" step="0.01"></dd></div>
<div><dt data-i18n="info.kicks"></dt><dd id="iKicks"></dd></div>
<div><dt data-i18n="info.beats"></dt><dd id="iBeats"></dd></div>
<div><dt data-i18n="info.jumps"></dt><dd id="iJumps">–</dd></div>
</dl>
</div>
<div id="waxis" class="axis" aria-hidden="true"></div>
<div id="stageEmpty" class="empty">
<b data-i18n="empty.stage"></b>
<span data-i18n="empty.stage.hint"></span>
<button id="stageAdd" type="button" data-i18n="empty.addVideo"></button>
<button id="stageFetch" type="button" class="link" data-i18n="empty.fetch"></button>
</div>
<div id="stage" hidden>
<canvas id="screen" aria-label="Preview"></canvas>
<video id="vA" muted playsinline preload="auto"></video>
<video id="vB" muted playsinline preload="auto"></video>
<video id="vC" muted playsinline preload="auto"></video>
<video id="vD" muted playsinline preload="auto"></video>
<div class="controls">
<button id="play" type="button" aria-pressed="false" disabled></button>
<button id="loop" type="button" class="icon" aria-pressed="false" hidden></button>
<button id="regionClear" type="button" hidden data-i18n="region.clear"></button>
<button id="export" type="button" disabled data-i18n="export"></button>
<label><span data-i18n="aspect"></span> <select id="aspect">
<option value="source" data-i18n="aspect.source"></option>
<option value="9:16">9:16</option>
<option value="1:1">1:1</option>
</select></label>
<label><span data-i18n="rate"></span> <select id="rate">
<option value="0" data-i18n="rate.source"></option>
<option value="30">30</option>
</select></label>
<label><span data-i18n="quality"></span> <select id="quality">
<option value="draft" data-i18n="quality.draft"></option>
<option value="normal" data-i18n="quality.normal" selected></option>
<option value="high" data-i18n="quality.high"></option>
</select></label>
<button id="cancel" type="button" hidden data-i18n="cancel"></button>
<progress id="progress" max="1" value="0" hidden></progress>
<span id="exportInfo" class="note"></span>
</div>
<div id="crop" hidden></div>
</div>
<div id="ctlDock"></div>
<div id="readout" aria-live="off"></div>
</main>
<dialog id="helpDlg"></dialog>
<aside id="desk" aria-label="Settings"></aside>
</div>
<script src="vendor/beatgrid.js"></script>
<script src="vendor/ascii.js"></script>
<script src="edl.js"></script>
<script src="strips.js"></script>
<script src="settings.js"></script>
<script src="strings.js"></script>
<script src="fetch-model.js"></script>
<script src="fetch-ui.js"></script>
<script src="flow-gl.js"></script>
<script src="render-gl.js"></script>
<script src="reverse-buffer.js"></script>
<script src="preview.js"></script>
<script src="export.js"></script>
<script src="convert.js"></script>
<script src="help.js"></script>
<script src="panel.js"></script>
<script src="app.js"></script>
</body>
</html>
